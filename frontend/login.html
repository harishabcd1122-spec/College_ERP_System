<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Task Management System</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Ambient Glowing Background Elements -->
  <div class="ambient-glow-top"></div>
  <div class="ambient-glow-left"></div>
  <div class="ambient-glow-right"></div>
  <div class="bg-grid-overlay"></div>

  <!-- Navigation Bar -->
  <header class="navbar-wrapper">
    <nav class="navbar">
      <a href="index.html" class="nav-brand">
        <div class="nav-logo-icon">
          <i class="fa-solid fa-check"></i>
        </div>
        <span class="nav-brand-text">
          <span class="brand-light">Task</span><span class="brand-gradient">Manager</span>
        </span>
      </a>
      <div class="nav-actions">
        <a href="register.html" class="btn btn-secondary btn-sm">Create Account</a>
      </div>
    </nav>
  </header>

  <!-- Login Form Wrapper -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Enter your credentials to access your tasks</p>
      </div>

      <!-- Alert Notification Message Box -->
      <div id="alertBox" class="alert-box" style="display: none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="name@example.com" 
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block" style="margin-top: 1.25rem;">
          Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Task Management System. All rights reserved.</p>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
