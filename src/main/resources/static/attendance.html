<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg">

<div class="container-fluid">

<a class="navbar-brand">

<i class="bi bi-mortarboard-fill"></i>

College ERP

</a>

<div class="ms-auto">

<a href="dashboard.html" class="btn btn-primary me-2">

<i class="bi bi-house-fill"></i>

Dashboard

</a>

<button class="btn btn-danger" onclick="logout()">

<i class="bi bi-box-arrow-right"></i>

Logout

</button>

</div>

</div>

</nav>

<div class="container mt-5">

<h2 class="mb-4">

<i class="bi bi-calendar-check-fill"></i>

Attendance Management

</h2>

<div class="row g-4">

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-calendar-check-fill display-5"></i>

<h2 id="attendanceCount">0</h2>

<p>Total Records</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-check-circle-fill display-5"></i>

<h2 id="presentCount">0</h2>

<p>Present</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-x-circle-fill display-5"></i>

<h2 id="absentCount">0</h2>

<p>Absent</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-people-fill display-5"></i>

<h2 id="studentCount">0</h2>

<p>Students</p>

</div>

</div>

</div>

</div>

<div class="card mt-5">

<div class="card-body">

<div class="row">

<div class="col-md-4">

<input
type="text"
id="search"
class="form-control"
placeholder="🔍 Search Student..."
onkeyup="searchAttendance()">

</div>

<div class="col-md-8 text-end">

<button class="btn btn-success crud-btn" onclick="openAddModal()">

<i class="bi bi-plus-circle-fill"></i>

Add Attendance

</button>



</div>

</div>

<hr>

<div class="table-responsive">

<table class="table table-dark table-hover">

<thead>

<tr>

<th>ID</th>

<th>Student Name</th>

<th>Date</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="attendanceTable">

</tbody>

</table>

</div>

</div>

</div>
<!-- Add Attendance Modal -->

<div class="modal fade" id="attendanceModal" tabindex="-1">

<div class="modal-dialog">

<div class="modal-content bg-dark text-white">

<div class="modal-header">

<h5 class="modal-title">

Add Attendance

</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body">
    <input type="hidden" id="attendanceId">

<input
type="text"
id="studentName"
class="form-control mb-3"
placeholder="Student Name">

<input
type="date"
id="attendanceDate"
class="form-control mb-3">

<select
id="status"
class="form-select">

<option value="Present">Present</option>

<option value="Absent">Absent</option>

</select>

</div>

<div class="modal-footer">

<button
id="saveBtn"
class="btn btn-success crud-btn"
onclick="saveAttendance()">

Save Attendance

</button>

</div>

</div>

</div>

</div>

<footer class="mt-5">

<div class="container text-center">

<h5>

<i class="bi bi-mortarboard-fill"></i>

College ERP System

</h5>

<p>

Attendance Management Module

</p>

<p>

© 2026 All Rights Reserved

</p>

</div>

</footer>

<script>

const api="http://localhost:8081/attendance";

let modal;

window.onload=function(){

modal=new bootstrap.Modal(document.getElementById("attendanceModal"));

loadAttendance();

hideStudentCrud();

}
function loadAttendance() {

    console.log("loadAttendance() called");

    fetch(api)
    .then(response => response.json())
    .then(data => {

        console.log("Fetched Data:", data);

        let rows = "";
        let present = 0;
        let absent = 0;

        data.forEach(record => {

            if(record.status === "Present")
                present++;
            else
                absent++;

            rows += `
            <tr>
                <td>${record.id}</td>
                <td>${record.studentName}</td>
                <td>${record.date}</td>
                <td>
                    <span class="badge ${record.status==="Present"?"bg-success":"bg-danger"}">
                        ${record.status}
                    </span>
                </td>
                <td>
                    <button class="btn btn-warning btn-sm crud-btn"
                        onclick="editAttendance(${record.id})">
                        <i class="bi bi-pencil-fill"></i>
                    </button>

                    <button class="btn btn-danger btn-sm crud-btn"
                        onclick="deleteAttendance(${record.id})">
                        <i class="bi bi-trash-fill"></i>
                    </button>
                </td>
            </tr>`;
        });

        document.getElementById("attendanceTable").innerHTML = rows;
        document.getElementById("attendanceCount").innerHTML = data.length;
        document.getElementById("presentCount").innerHTML = present;
        document.getElementById("absentCount").innerHTML = absent;
        document.getElementById("studentCount").innerHTML = data.length;

        console.log("Table Updated");
    })
    .catch(error => {
        console.error("loadAttendance Error:", error);
    });

}

function openAddModal(){

if(getRole()==="student"){

alert("Students can only view attendance.");

return;

}

document.getElementById("attendanceId").value="";
document.getElementById("studentName").value="";
document.getElementById("attendanceDate").value="";
document.getElementById("status").value="Present";

document.querySelector(".modal-title").innerHTML="Add Attendance";
document.getElementById("saveBtn").innerHTML="Save Attendance";

modal.show();

}
function editAttendance(id){
    if(getRole()==="student"){

    alert("Students can only view attendance.");

    return;

}

    fetch(api+"/"+id)

    .then(response=>response.json())

    .then(record=>{

        document.getElementById("attendanceId").value=record.id;

        document.getElementById("studentName").value=record.studentName;

        document.getElementById("attendanceDate").value=record.date;

        document.getElementById("status").value=record.status;

        document.querySelector(".modal-title").innerHTML="Edit Attendance";

        document.getElementById("saveBtn").innerHTML="Update Attendance";

        modal.show();

    });

}
function saveAttendance(){
    if(getRole()==="student"){

    alert("Students cannot modify attendance.");

    return;

}

    const id=document.getElementById("attendanceId").value;

    const attendance={

        studentName:document.getElementById("studentName").value,

        date:document.getElementById("attendanceDate").value,

        status:document.getElementById("status").value

    };

    const url=id===""?api:api+"/"+id;

    const method=id===""?"POST":"PUT";
    console.log("ID:", id);
    console.log("Method:", method);
    console.log("URL:", url);

    fetch(url,{
    method: method,
    headers:{
        "Content-Type":"application/json"
    },
    body: JSON.stringify(attendance)
})
.then(response => {
    console.log("Status:", response.status);
    return response.json();
})
.then(data => {
    console.log("Response:", data);
    modal.hide();
    loadAttendance();
})
  .catch(error => console.error(error));

}

function deleteAttendance(id){

if(getRole()==="student"){

alert("Students cannot delete attendance.");

return;

}

if(confirm("Delete this attendance record?")){

fetch(api+"/"+id,{

method:"DELETE"

})

.then(()=>loadAttendance());

}

}
function searchAttendance(){

let input=document.getElementById("search").value.toUpperCase();

let tr=document.getElementById("attendanceTable").getElementsByTagName("tr");

for(let i=0;i<tr.length;i++){

let td=tr[i].getElementsByTagName("td")[1];

if(td){

let value=td.textContent||td.innerText;

tr[i].style.display=value.toUpperCase().indexOf(input)>-1?"":"none";

}

}

}

function logout(){

if(confirm("Logout?")){

window.location.href="login.html";

}

}
</script>
<script src="js/auth.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
