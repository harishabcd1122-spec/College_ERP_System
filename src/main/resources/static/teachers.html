<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg">

<div class="container-fluid">

<a class="navbar-brand">

<i class="bi bi-mortarboard-fill"></i>

College ERP

</a>

<div class="ms-auto">

<a href="dashboard.html" class="btn btn-primary me-2">

<i class="bi bi-house-fill"></i>

Dashboard

</a>

<button class="btn btn-danger" onclick="logout()">

<i class="bi bi-box-arrow-right"></i>

Logout

</button>

</div>

</div>

</nav>

<div class="container mt-5">

<h2 class="mb-4">

<i class="bi bi-person-workspace"></i>

Teacher Management

</h2>

<div class="row g-4">

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-person-workspace display-5"></i>

<h2 id="teacherCount">0</h2>

<p>Total Teachers</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-building display-5"></i>

<h2 id="departmentCount">0</h2>

<p>Departments</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-award-fill display-5"></i>

<h2 id="experienceCount">0</h2>

<p>Experienced</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-envelope-fill display-5"></i>

<h2 id="emailCount">0</h2>

<p>Email IDs</p>

</div>

</div>

</div>

</div>

<div class="card mt-5">

<div class="card-body">

<div class="row">

<div class="col-md-4">

<input
type="text"
id="search"
class="form-control"
placeholder="🔍 Search Teacher..."
onkeyup="searchTeacher()">

</div>

<div class="col-md-8 text-end">

<button
class="btn btn-success crud-btn"
onclick="openAddModal()">

<i class="bi bi-plus-circle-fill"></i>

Add Teacher

</button>
</div>

</div>

<hr>

<div class="table-responsive">

<table class="table table-dark table-hover">

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Department</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="teacherTable">

</tbody>

</table>

</div>

</div>

</div>
<!-- Add Teacher Modal -->

<div class="modal fade" id="teacherModal" tabindex="-1">

<div class="modal-dialog">

<div class="modal-content bg-dark text-white">

<div class="modal-header">

<h5 class="modal-title">

Add Teacher

</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body">

<input type="hidden" id="teacherId">

<input
type="text"
id="name"
class="form-control mb-3"
placeholder="Teacher Name">
<input
type="email"
id="email"
class="form-control mb-3"
placeholder="Email">

<input
type="text"
id="department"
class="form-control"
placeholder="Department">

</div>

<div class="modal-footer">

<button
id="saveBtn"
class="btn btn-success"
onclick="saveTeacher()">

Save Teacher

</button>

</div>

</div>

</div>

</div>

<footer class="mt-5">

<div class="container text-center">

<h5>

<i class="bi bi-mortarboard-fill"></i>

College ERP System

</h5>

<p>

Teacher Management Module

</p>

<p>

© 2026 All Rights Reserved

</p>

</div>

</footer>

<script>

const api="http://localhost:8081/teachers";

let modal;

window.onload=function(){

modal=new bootstrap.Modal(document.getElementById("teacherModal"));

loadTeachers();

hideStudentCrud();

}

function loadTeachers(){

fetch(api)

.then(response=>response.json())

.then(data=>{

let rows="";

data.forEach(teacher=>{

rows+=`

<tr>

<td>${teacher.id}</td>

<td>${teacher.name}</td>

<td>${teacher.email}</td>

<td>${teacher.department}</td>

<td>

<button
class="btn btn-warning btn-sm"
onclick="editTeacher(${teacher.id})">

<i class="bi bi-pencil-fill"></i>

</button>

<button
class="btn btn-danger btn-sm"
onclick="deleteTeacher(${teacher.id})">

<i class="bi bi-trash-fill"></i>

</button>

</td>

</tr>

`;

});

document.getElementById("teacherTable").innerHTML=rows;

document.getElementById("teacherCount").innerHTML=data.length;

document.getElementById("emailCount").innerHTML=data.length;

document.getElementById("departmentCount").innerHTML=[...new Set(data.map(t=>t.department))].length;

document.getElementById("experienceCount").innerHTML=data.length;

});

}

function openAddModal(){

if(getRole()==="student"){

alert("Students can only view data.");

return;

}

document.getElementById("teacherId").value="";
document.getElementById("name").value="";
document.getElementById("email").value="";
document.getElementById("department").value="";

document.querySelector(".modal-title").innerHTML="Add Teacher";

document.getElementById("saveBtn").innerHTML="Save Teacher";

modal.show();

}
function editTeacher(id){

if(getRole()==="student"){

alert("Students can only view data.");

return;

}

fetch(api+"/"+id)

.then(response=>response.json())

.then(teacher=>{

document.getElementById("teacherId").value=teacher.id;

document.getElementById("name").value=teacher.name;

document.getElementById("email").value=teacher.email;

document.getElementById("department").value=teacher.department;

document.querySelector(".modal-title").innerHTML="Edit Teacher";

document.getElementById("saveBtn").innerHTML="Update Teacher";

modal.show();

});

}

function saveTeacher(){

if(getRole()==="student"){

alert("Students cannot modify data.");

return;

}

const id=document.getElementById("teacherId").value;

const teacher={

name:document.getElementById("name").value,

email:document.getElementById("email").value,

department:document.getElementById("department").value

};

const url=id===""?api:api+"/"+id;

const method=id===""?"POST":"PUT";

fetch(url,{

method:method,

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify(teacher)

})

.then(()=>{

modal.hide();

loadTeachers();

});

}
function deleteTeacher(id){

if(getRole()==="student"){

alert("Students cannot delete data.");

return;

}

if(confirm("Delete this teacher?")){

fetch(api+"/"+id,{

method:"DELETE"

})

.then(()=>loadTeachers());

}

}

function searchTeacher(){

let input=document.getElementById("search").value.toUpperCase();

let tr=document.getElementById("teacherTable").getElementsByTagName("tr");

for(let i=0;i<tr.length;i++){

let td=tr[i].getElementsByTagName("td")[1];

if(td){

let value=td.textContent||td.innerText;

tr[i].style.display=value.toUpperCase().indexOf(input)>-1?"":"none";

}

}

}

function logout(){

if(confirm("Logout?")){

window.location.href="login.html";

}

}

</script>
<script src="js/auth.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
