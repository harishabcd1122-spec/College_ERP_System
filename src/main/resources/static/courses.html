<body>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-book-fill display-5"></i>

<h2 id="courseCount">0</h2>

<p>Total Courses</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-diagram-3-fill display-5"></i>

<h2 id="departmentCount">0</h2>

<p>Departments</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-clock-history display-5"></i>

<h2 id="durationCount">0</h2>

<p>Semesters</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-journal-richtext display-5"></i>

<h2 id="activeCount">0</h2>

<p>Active Courses</p>

</div>

</div>

</div>

</div>

<div class="card mt-5">

<div class="card-body">

<div class="row">

<div class="col-md-4">

<input
type="text"
id="search"
class="form-control"
placeholder="🔍 Search Course..."
onkeyup="searchCourse()">

</div>

class="btn btn-success crud-btn"
onclick="openAddModal()">

</button>

</div>

<hr>

<div class="table-responsive">

<table class="table table-dark table-hover">

<thead>

<tr>

<th>ID</th>

<th>Course Name</th>

<th>Department</th>

<th>Semester</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="courseTable">

</tbody>

</table>

</div>

</div>

</div>
<!-- Add Course Modal -->

<div class="modal fade" id="courseModal" tabindex="-1">

<div class="modal-dialog">

<div class="modal-content bg-dark text-white">

<div class="modal-header">

<h5 class="modal-title">

Add Course

</h5>

<button
type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body">

<input type="hidden" id="courseId">

<input
type="text"
id="courseCode"
class="form-control mb-3"
placeholder="Course Code">

<input
type="text"
id="courseName"
class="form-control mb-3"
placeholder="Course Name">

<input
type="text"
id="department"
class="form-control mb-3"
placeholder="Department">

<input
type="text"
id="teacherName"
class="form-control mb-3"
placeholder="Teacher Name">

<input
type="number"
id="semester"
class="form-control"
placeholder="Semester">

</div>
<div class="modal-footer">

<button
id="saveBtn"
class="btn btn-success crud-btn"
onclick="saveCourse()">

Save Course

</button>

</div>

</div>

</div>

</div>

<div class="container text-center">

<h5>

<i class="bi bi-mortarboard-fill"></i>

College ERP System

</h5>

<p>

Course Management Module

</p>

<p>

© 2026 All Rights Reserved

</p>

</div>

</footer>

<script>

const api="http://localhost:8081/courses";

let modal;

window.onload=function(){

modal=new bootstrap.Modal(document.getElementById("courseModal"));

loadCourses();

hideStudentCrud();

}
function loadCourses(){

fetch(api)

.then(response=>response.json())

.then(data=>{

let rows="";

data.forEach(course=>{

rows+=`

<tr>

<td>${course.id}</td>

<td>${course.courseName}</td>

<td>${course.department}</td>

<td>${course.semester}</td>

<td>

<button
class="btn btn-warning btn-sm crud-btn"
onclick="editCourse(${course.id})">

<i class="bi bi-pencil-fill"></i>

</button>

<button
class="btn btn-danger btn-sm crud-btn"
onclick="deleteCourse(${course.id})">

<i class="bi bi-trash-fill"></i>

</button>

</td>

</tr>

`;

});

document.getElementById("courseTable").innerHTML=rows;

document.getElementById("courseCount").innerHTML=data.length;

document.getElementById("activeCount").innerHTML=data.length;

document.getElementById("departmentCount").innerHTML=[...new Set(data.map(c=>c.department))].length;

document.getElementById("durationCount").innerHTML=Math.max(...data.map(c=>c.semester),0);

});

}

function openAddModal(){

if(getRole()==="student"){

alert("Students can only view courses.");

return;

}

document.getElementById("courseId").value="";
document.getElementById("courseCode").value="";
document.getElementById("courseName").value="";
document.getElementById("department").value="";
document.getElementById("teacherName").value="";
document.getElementById("semester").value="";

document.querySelector(".modal-title").innerHTML="Add Course";

document.getElementById("saveBtn").innerHTML="Save Course";

modal.show();

}
function editCourse(id){
    if(getRole()==="student"){

    alert("Students can only view courses.");

    return;

}

    fetch(api + "/" + id)
    .then(response => response.json())
    .then(course => {

        document.getElementById("courseId").value = course.id;
        document.getElementById("courseCode").value = course.courseCode;
        document.getElementById("courseName").value = course.courseName;
        document.getElementById("department").value = course.department;
        document.getElementById("teacherName").value = course.teacherName;
        document.getElementById("semester").value = course.semester;

        document.querySelector(".modal-title").innerHTML = "Edit Course";
        document.getElementById("saveBtn").innerHTML = "Update Course";

        modal.show();
    });

}
function saveCourse() {
    if(getRole()==="student"){

    alert("Students cannot modify courses.");

    return;

}

    const id = document.getElementById("courseId").value;

    const course = {
        courseName: document.getElementById("courseName").value,
        courseCode: document.getElementById("courseCode").value,
        department: document.getElementById("department").value,
        teacherName: document.getElementById("teacherName").value,
        semester: parseInt(document.getElementById("semester").value)
    };

    const url = id === "" ? api : api + "/" + id;
    const method = id === "" ? "POST" : "PUT";
    console.log("saveCourse called");
    console.log("Method:", method, "URL:", url);

    fetch(url, {
        method: method,
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(course)
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }
        return response.json();
    })
    .then(data => {

        alert(id === "" ? "Course added successfully!" : "Course updated successfully!");

        
        const modalElement = document.getElementById("courseModal");
        const modalInstance = bootstrap.Modal.getInstance(modalElement);
        modalInstance.hide();
        loadCourses();

    })
    .catch(error => {
        console.error("Error:", error);
        alert("Operation failed!");
    });
}

function deleteCourse(id){

if(getRole()==="student"){

alert("Students cannot delete courses.");

return;

}

if(confirm("Delete this course?")){

fetch(api+"/"+id,{
method:"DELETE"
})

.then(()=>loadCourses());

}

}
function searchCourse(){

let input=document.getElementById("search").value.toUpperCase();

let tr=document.getElementById("courseTable").getElementsByTagName("tr");

for(let i=0;i<tr.length;i++){

let td=tr[i].getElementsByTagName("td")[1];

if(td){

let value=td.textContent||td.innerText;

tr[i].style.display=value.toUpperCase().indexOf(input)>-1?"":"none";

}

}

}

function logout(){

if(confirm("Logout?")){

window.location.href="login.html";

}

}

</script>
<script src="js/auth.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
