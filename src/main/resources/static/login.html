<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>College ERP Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

<div class="row justify-content-center align-items-center" style="min-height:100vh;">

<div class="col-lg-5">

<div class="login-card fade-up">

<div class="text-center mb-4">

<i class="bi bi-mortarboard-fill" style="font-size:70px;color:#60a5fa;"></i>

<h2 class="mt-3">College ERP System</h2>

<p style="color:#d1d5db;">Login to continue</p>

</div>

<form id="loginForm">

<div class="mb-3">

<label class="form-label">
<i class="bi bi-person-fill"></i>
Username
</label>

<input
type="text"
id="username"
class="form-control"
placeholder="Enter Username"
required>

</div>

<div class="mb-3">

<label class="form-label">
<i class="bi bi-lock-fill"></i>
Password
</label>

<div class="input-group">

<input
type="password"
id="password"
class="form-control"
placeholder="Enter Password"
required>

<button
class="btn btn-dark"
type="button"
onclick="togglePassword()">

<i id="eyeIcon" class="bi bi-eye-fill"></i>

</button>

</div>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-primary btn-lg">

<i class="bi bi-box-arrow-in-right"></i>

Login

</button>

</div>

</form>

<div class="text-center mt-4">

<a href="index.html" class="btn btn-success">

<i class="bi bi-house-fill"></i>

Back to Home

</a>

</div>

</div>

</div>

</div>

</div>

<script src="js/auth.js"></script>

<script>

function togglePassword(){

const password=document.getElementById("password");
const eye=document.getElementById("eyeIcon");

if(password.type==="password"){

password.type="text";
eye.classList.remove("bi-eye-fill");
eye.classList.add("bi-eye-slash-fill");

}else{

password.type="password";
eye.classList.remove("bi-eye-slash-fill");
eye.classList.add("bi-eye-fill");

}

}

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

const username=document.getElementById("username").value;
const password=document.getElementById("password").value;

fetch("http://localhost:8081/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username:username,
password:password

})

})

.then(response=>{

if(!response.ok){

throw new Error("Invalid Username or Password");

}

return response.json();

})

.then(user=>{

localStorage.setItem("loggedUser",JSON.stringify(user));

saveRole(user.role.toLowerCase());

if(user.role==="ADMIN"){

window.location.href="admin.html";

}

else if(user.role==="TEACHER"){

window.location.href="teacher.html";

}

else if(user.role==="STUDENT"){

window.location.href="student.html";

}

})

.catch(error=>{

alert(error.message);

});

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
