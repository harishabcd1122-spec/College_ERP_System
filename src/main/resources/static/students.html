<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Students</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg">

<div class="container-fluid">

<a class="navbar-brand">

<i class="bi bi-mortarboard-fill"></i>

College ERP

</a>

<div class="ms-auto">

<a href="dashboard.html" class="btn btn-primary me-2">

<i class="bi bi-house-fill"></i>

Dashboard

</a>

<button class="btn btn-danger" onclick="logout()">

<i class="bi bi-box-arrow-right"></i>

Logout

</button>

</div>

</div>

</nav>

<div class="container mt-5">

<h2 class="mb-4">

<i class="bi bi-people-fill"></i>

Student Management

</h2>

<div class="row g-4">

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-people-fill display-5"></i>

<h2 id="studentCount">0</h2>

<p>Total Students</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-person-check-fill display-5"></i>

<h2 id="departmentCount">0</h2>

<p>Departments</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-award-fill display-5"></i>

<h2 id="topStudent">--</h2>

<p>Top Student</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body text-center">

<i class="bi bi-envelope-fill display-5"></i>

<h2 id="emailCount">0</h2>

<p>Emails</p>

</div>

</div>

</div>

</div>

<div class="card mt-5">

<div class="card-body">

<div class="row">

<div class="col-md-4">

<input
type="text"
id="search"
class="form-control"
placeholder="🔍 Search Student..."
onkeyup="searchStudent()">

</div>

<div class="col-md-8 text-end">

<button class="btn btn-success crud-btn" onclick="openAddModal()">

<i class="bi bi-plus-circle-fill"></i>

Add Student

</button>

<a href="/students/pdf" class="btn btn-danger">

<i class="bi bi-file-earmark-pdf-fill"></i>

PDF

</a>
</div>

</div>

<hr>

<div class="table-responsive">

<table class="table table-dark table-hover align-middle">

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Department</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="studentTable">

</tbody>

</table>

</div>

</div>

</div>
<!-- Add Student Modal -->

<div class="modal fade" id="studentModal" tabindex="-1">

<div class="modal-dialog">

<div class="modal-content bg-dark text-white">

<div class="modal-header">

<h5 class="modal-title">

Add Student

</h5>

<button type="button"
class="btn-close btn-close-white"
data-bs-dismiss="modal">

</button>

</div>

<div class="modal-body">

<input type="hidden" id="studentId">

<input type="text"
id="name"
class="form-control mb-3"
placeholder="Student Name">

<input type="email"
id="email"
class="form-control mb-3"
placeholder="Email">

<input type="text"
id="department"
class="form-control"
placeholder="Department">

</div>

<div class="modal-footer">

<button
id="saveBtn"
class="btn btn-success crud-btn"
onclick="saveStudent()">

Save Student

</button>

</div>

</div>

</div>

</div>

<footer class="mt-5">

<div class="container text-center">

<h5>

<i class="bi bi-mortarboard-fill"></i>

College ERP System

</h5>

<p>

Student Management Module

</p>

<p>

© 2026 All Rights Reserved

</p>

</div>

</footer>

<script>

const api="http://localhost:8081/students";

const dashboardApi="http://localhost:8081/dashboard";

let modal;

window.onload=function(){

modal=new bootstrap.Modal(document.getElementById("studentModal"));

loadStudents();

loadDashboard();

// Hide CRUD buttons for students
hideStudentCrud();

}
function loadStudents(){

fetch(api)

.then(r=>r.json())

.then(data=>{

let rows="";

data.forEach(student=>{

rows+=`

<tr>

<td>${student.id}</td>

<td>${student.name}</td>

<td>${student.email}</td>

<td>${student.department}</td>

<td>

<button
class="btn btn-warning btn-sm crud-btn"
onclick="editStudent(${student.id})">

<i class="bi bi-pencil-fill"></i>

</button>

<button
class="btn btn-danger btn-sm crud-btn"
onclick="deleteStudent(${student.id})">

<i class="bi bi-trash-fill"></i>

</button>

<a
class="btn btn-primary btn-sm"
href="/students/report/${student.id}">

<i class="bi bi-file-earmark-pdf-fill"></i>

</a>

</td>

</tr>

`;

});

document.getElementById("studentTable").innerHTML=rows;

document.getElementById("studentCount").innerHTML=data.length;

document.getElementById("emailCount").innerHTML=data.length;

});

}


function loadDashboard(){

fetch(dashboardApi)

.then(r=>r.json())

.then(data=>{

fetch(dashboardApi+"/departments")

.then(r=>r.json())

.then(departments=>{

document.getElementById("departmentCount").innerHTML=Object.keys(departments).length;

});

if(data.topScorer!=null)

document.getElementById("topStudent").innerHTML=data.topScorer;

});

}

function searchStudent(){

let input=document.getElementById("search").value.toUpperCase();

let table=document.getElementById("studentTable");

let tr=table.getElementsByTagName("tr");

for(let i=0;i<tr.length;i++){

let td=tr[i].getElementsByTagName("td")[1];

if(td){

let value=td.textContent||td.innerText;

tr[i].style.display=value.toUpperCase().indexOf(input)>-1?"":"none";

}

}

}

function openAddModal(){

    if(getRole() === "student"){
        alert("Students can only view data.");
        return;
    }

    document.getElementById("studentId").value="";
    document.getElementById("name").value="";
    document.getElementById("email").value="";
    document.getElementById("department").value="";

    document.querySelector(".modal-title").innerHTML="Add Student";
    document.getElementById("saveBtn").innerHTML="Save Student";

    modal.show();
}
function editStudent(id){

    if(getRole() === "student"){
        alert("Students can only view data.");
        return;
    }

    fetch(api+"/"+id)

    .then(r=>r.json())

    .then(student=>{

        document.getElementById("studentId").value=student.id;
        document.getElementById("name").value=student.name;
        document.getElementById("email").value=student.email;
        document.getElementById("department").value=student.department;

        document.querySelector(".modal-title").innerHTML="Edit Student";
        document.getElementById("saveBtn").innerHTML="Update Student";

        modal.show();

    });

}
function saveStudent() {

    if(getRole() === "student"){
        alert("Students cannot modify data.");
        return;
    }

    const id = document.getElementById("studentId").value;

    const student = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        department: document.getElementById("department").value
    };

    const url = id === "" ? api : api + "/" + id;
    const method = id === "" ? "POST" : "PUT";

    fetch(url, {
        method: method,
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(student)
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Failed to save student");
        }
        return response.json();
    })
    .then(data => {
        console.log(data);
        modal.hide();
        loadStudents();
        loadDashboard();
    })
    .catch(error => {
        console.error(error);
        alert(error.message);
    });

}

function deleteStudent(id){

    if(getRole() === "student"){
        alert("Students cannot delete data.");
        return;
    }

    if(confirm("Delete this student?")){

        fetch(api+"/"+id,{

            method:"DELETE"

        })

        .then(()=>loadStudents());

    }

}

function logout(){

if(confirm("Logout?")){

window.location.href="login.html";

}

}

</script>
<script src="js/auth.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
