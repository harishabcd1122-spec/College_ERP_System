# Server Configuration
server.port=8080

# Application Name
spring.application.name=task-management-system

# MySQL Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/task_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Credentials
# Standard local MySQL username is typically 'root'. Change if your MySQL setup uses a different username.
spring.datasource.username=root
# Enter your local MySQL password below (leave blank if your MySQL root account has no password)
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
